<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings and Text</title>
</head>
<body>
    <h1 style="font-family: serif; font-size: 36px;">Ini adalah latihan membuat heading dan teks</h1>
    
    <h2 style="font-family: serif; font-size: 28px;">Kenapa saya belajar kedua hal tersebut?</h2>
    
    <p style="font-family: 'Times New Roman', serif; font-size: 18px;">Karena saya ingin menjadi Software Developer yang kompeten</p>
    
    <h3 style="font-family: serif; font-size: 22px;">Apa strategi saya untuk mencapai tujuan yang saya inginkan?</h3>
    
    <p style="font-family: 'Times New Roman', serif; font-size: 18px;">Saya akan belajar dengan tekun setiap hari.</p>
</body>
</html>
